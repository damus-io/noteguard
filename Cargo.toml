[package]
name = "noteguard"
version = "0.1.0"
edition = "2021"

[features]
forwarder = ["tokio-tungstenite", "tokio", "futures-util"]
# nscript: run user-submitted WASM note filters (Phase 0 spike)
nscript = ["wasmtime"]
# cloudflare: escalate BanTracker IP-bans to a Cloudflare WAF IP list (edge block)
cloudflare = ["ureq"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
toml = "0.5"
ipnetwork = "0.20.0"
unicode-security = "0.1.2"

# shared-memory per-IP read-bandwidth buckets: one mmap'd MAP_SHARED file shared
# by every `noteguard read` plugin process on the host (memmap2), timestamped
# against the system-wide CLOCK_MONOTONIC (libc clock_gettime).
memmap2 = "0.9"
libc = "0.2"

# forwarder deps
tokio-tungstenite = { version = "0.23.1", optional = true, features = ["native-tls"] }
tokio = { version = "1.38.0", features = ["macros", "time", "sync", "rt-multi-thread"], optional = true }
futures-util = { version = "0.3.30", optional = true }
log = "0.4.22"
env_logger = "0.11.3"

# nscript deps
wasmtime = { version = "48", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }

# cloudflare deps — blocking HTTP client for the edge-ban worker
ureq = { version = "2", optional = true, features = ["json"] }
