[workspace]
members = ["noteguard-core"]

[package]
name = "noteguard"
version = "0.1.0"
edition = "2021"
description = "Strfry write policy plugin with configurable filter pipeline"

[features]
forwarder = ["noteguard-core/forwarder", "tokio"]

[dependencies]
# Core filtering library
noteguard-core = { path = "./noteguard-core" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"

# Logging
log = "0.4.22"
env_logger = "0.11.3"

# Required for forwarder feature (async main)
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"], optional = true }
