[package]
name = "noteguard-core"
version = "0.1.0"
edition = "2021"
description = "Core filtering library for Nostr events - can be embedded in any relay"

[features]
# The forwarder filter requires async runtime support
forwarder = ["tokio-tungstenite", "tokio", "futures-util"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"
ipnetwork = "0.20.0"
log = "0.4.22"

# Forwarder filter dependencies (optional)
tokio-tungstenite = { version = "0.23.1", optional = true, features = ["native-tls"] }
tokio = { version = "1.38.0", features = ["macros", "time", "sync", "rt-multi-thread"], optional = true }
futures-util = { version = "0.3.30", optional = true }
